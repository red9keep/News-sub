name: commentary

# 알파스코프 시황 해설 (worker/commentary.py, News-doc 요청-알파스코프-시황-해설.md)
# 11-16 사용자 결정: 품질을 확인할 때까지 자동 실행 멈춤. 지금은 손으로만 돌린다 (dry로 시험 글 보기).
# 다시 켤 때: ① cron-trigger/src/index.js COMMENTARY에 08:10 am · 20:30 pm 되살리고 wrangler deploy
#             ② 아래 schedule 예비 cron 되살림 ("14 23 * * *" = 08:14 KST am, "33 11 * * *" = 20:33 KST pm)
#   이미 그 편이 있으면 바로 끝나고, 마감(08:30 · 20:40)을 넘겼으면 skip 문서만 남긴다
# 유튜브 요청 · VPN이 없어 수집(collect)과 따로 돈다 (Q1: 같은 줄에 서지 않게)
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "편: am · pm · auto (낮 12시 전이면 am)"
        type: choice
        options: [auto, am, pm]
        default: auto
      date:
        description: "편 날짜 YYYY-MM-DD (비우면 오늘 KST)"
        type: string
        default: ""
      force:
        description: "마감 · 이미 있음 무시하고 다시 쓰기 (rev 올림, 옛 내용은 columns_history)"
        type: boolean
        default: false
      dry:
        description: "저장하지 않고 결과만 로그에 출력"
        type: boolean
        default: false
      story:
        description: "이어 쓰는 글 시험 (저장 안 함, 11-17)"
        type: boolean
        default: false
      model:
        description: "story에서 쓸 모델 (비우면 gemini-4-hydrogen, NVIDIA는 nvidia:z-ai/glm-5.3)"
        type: string
        default: ""
      scheduled:
        description: "바깥 예약기용 (사람은 끄고 쓴다)"
        type: boolean
        default: false

concurrency:
  group: commentary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # 이어 쓰는 글은 호출이 안 되면 30분까지 기다린다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install firebase-admin google-genai requests

      - name: 시황 해설 쓰기
        working-directory: worker
        run: |
          args="--slot ${SLOT:-auto}"
          [ -n "$DAY" ] && args="$args --date $DAY"
          [ "$FORCE" = "true" ] && args="$args --force"
          [ "$DRY" = "true" ] && args="$args --dry"
          [ "$STORY" = "true" ] && args="$args --story"
          [ -n "$MODEL" ] && args="$args --model $MODEL"
          echo "python commentary.py $args"
          python commentary.py $args
        env:
          PYTHONUNBUFFERED: "1"
          SLOT: ${{ inputs.slot }}
          DAY: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
          DRY: ${{ inputs.dry }}
          STORY: ${{ inputs.story }}
          MODEL: ${{ inputs.model }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}   # 없어도 됨 (없으면 기본 키만)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}   # story 시험에서 model=nvidia:z-ai/glm-5.3 일 때만 씀
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          # 다 쓴 글의 status. 비우면 draft-test (블로그가 발행하지 않는 시험 글). ready로 바꾸는 것은 사용자가 글을 보고 정한다
          COMMENTARY_STATUS: ${{ vars.COMMENTARY_STATUS }}
