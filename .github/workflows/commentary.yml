name: commentary

# 알파스코프 시황 해설 (worker/commentary.py, News-doc 요청-알파스코프-시황-해설.md)
# 11-16 멈춤 → 11-19 사용자 결정으로 자동 실행 다시 켬. 다 쓴 글은 COMMENTARY_STATUS(비움 = draft-test, 블로그 발행 안 함)
# 11-19: 글은 '이어 쓰는 시황 기사' 한 틀(format story, 요청 문서 17 ~ 23절). 옛 틀(facts · views)은 없앰
# 저장소가 공개라 글 · 걸린 문장은 실행 로그에 찍지 않는다 (11-18). 글과 쓰는 과정은 비공개 Firestore trials에 남고 웹(설정 > 시험 결과)에서 본다
# 정시 실행: cron-trigger/src/index.js COMMENTARY 08:10 am · 20:30 pm (KST). 아래 schedule은 예비
#   이미 그 편이 있으면 바로 끝나고, 마감(08:30 · 20:40)을 넘겼으면 skip 문서만 남긴다
#   11-20: schedule이 몇 시간 늦게 돌아 다른 편을 미리 썼다 → am 08:00 · pm 20:20 전이면 쓰지 않고 끝 (WRITE_OPEN_MIN)
# 멈출 때: COMMENTARY를 빈 표로 + wrangler deploy, 아래 schedule 지움
# 유튜브 요청 · VPN이 없어 수집(collect)과 따로 돈다 (Q1: 같은 줄에 서지 않게)
on:
  schedule:
    - cron: "14 23 * * *"   # 08:14 KST am (slot auto: 낮 12시 전이면 am)
    - cron: "43 7 * * *"    # 16:43 KST pm 1차 (11-20, 16:55까지 저장)
    - cron: "33 11 * * *"   # 20:33 KST pm 2차
  workflow_dispatch:
    inputs:
      slot:
        description: "편: am · pm · auto (낮 12시 전이면 am)"
        type: choice
        options: [auto, am, pm]
        default: auto
      date:
        description: "편 날짜 YYYY-MM-DD (비우면 오늘 KST)"
        type: string
        default: ""
      force:
        description: "마감 · 이미 있음 무시하고 다시 쓰기 (rev 올림, 옛 내용은 columns_history)"
        type: boolean
        default: false
      dry:
        description: "columns에 저장하지 않고 시험 결과로만 남김 (웹 설정 > 시험 결과)"
        type: boolean
        default: false
      story:
        description: "dry와 같음 (11-17 이름. columns에 저장 안 함, 글은 웹 설정 > 시험 결과)"
        type: boolean
        default: false
      model:
        description: "쓸 모델 (비우면 gemini-4-hydrogen, NVIDIA는 nvidia:z-ai/glm-5.3)"
        type: string
        default: ""
      scheduled:
        description: "바깥 예약기용 (사람은 끄고 쓴다)"
        type: boolean
        default: false

concurrency:
  group: commentary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # 호출이 안 되면 30분까지 기다린다 (예약 실행은 마감 08:30 · 20:40 안에서만)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install firebase-admin google-genai requests

      - name: 시황 해설 쓰기
        working-directory: worker
        run: |
          args="--slot ${SLOT:-auto}"
          [ -n "$DAY" ] && args="$args --date $DAY"
          [ "$FORCE" = "true" ] && args="$args --force"
          [ "$DRY" = "true" ] && args="$args --dry"
          [ "$STORY" = "true" ] && args="$args --story"
          [ -n "$MODEL" ] && args="$args --model $MODEL"
          echo "python commentary.py $args"
          python commentary.py $args
        env:
          PYTHONUNBUFFERED: "1"
          SLOT: ${{ inputs.slot }}
          DAY: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
          DRY: ${{ inputs.dry }}
          STORY: ${{ inputs.story }}
          MODEL: ${{ inputs.model }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}   # 없어도 됨 (없으면 기본 키만)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}   # story 시험에서 model=nvidia:z-ai/glm-5.3 일 때만 씀
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          # 다 쓴 글의 status. 비우면 draft-test (블로그가 발행하지 않는 시험 글). ready로 바꾸는 것은 사용자가 글을 보고 정한다
          COMMENTARY_STATUS: ${{ vars.COMMENTARY_STATUS }}
